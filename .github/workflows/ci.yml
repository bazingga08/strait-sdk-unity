name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test test/Strait.Signature.Tests.csproj
      - run: node scripts/unity-meta.mjs
      - run: node scripts/brand.mjs
